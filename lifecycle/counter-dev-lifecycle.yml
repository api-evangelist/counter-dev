source: >-
  https://github.com/ihucos/counter.dev (releases + tags APIs, both empty),
  https://github.com/ihucos/counter.dev-selfhost/releases, https://counter.dev/,
  https://counter.dev/help/, https://counter.dev/blog, and live probes of
