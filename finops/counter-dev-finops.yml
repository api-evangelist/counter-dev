description: >-
  FinOps view of Counter. Counter has no usage-based billing: the hosted
  counter.dev service is pay-what-you-want and free to use, and the AGPL-3.0
  server can be self-hosted at no license cost. As a result there is no
  per-token, per-request, or per-seat meter to allocate. The only real spend is
  (a) optional voluntary payments to the hosted service and (b) the operator's
  own infrastructure costs (Redis, the Go server, and an optional SQL archive
  database) when self-hosting.
notes: >-
  No vendor billing exports or metered charges exist. FOCUS alignment is
  nominal; the meaningful cost levers are voluntary support and self-host
  infrastructure. Unreconciled.
