principles:
- name: Visibility
  description: Track voluntary payments to the hosted service and, when self-hosting, your own Redis/compute/storage spend.
- name: Allocation
  description: For self-hosting, allocate infrastructure cost per deployment; the hosted service has no per-account meter.
- name: Optimization
  description: Self-host on modest infrastructure (Redis plus a small Go server) to keep costs near zero; the snippet's once-per-tab design keeps collect volume low.
- name: Accountability
  description: Decide voluntary support level for the hosted service; assign an owner for self-hosted infrastructure budgets.
