method: probed
source: >-
  https://cdn.counter.dev/script.js (fetched verbatim 2026-08-13),
  https://github.com/ihucos/counter.dev/blob/master/static/components/counter-trackingcode.js,
  https://counter.dev/help/integration.html, and the platform guides under
